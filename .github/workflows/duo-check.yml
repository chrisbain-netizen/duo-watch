name: iPhone Duo check

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # GitHub may delay runs by several minutes
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test push notification instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: duo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Runners are wiped every run, so keep "already alerted" state in the cache
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: iphone_duo_state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Check iPhone Duo availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            python iphone_duo_checker.py --test-push
          else
            python iphone_duo_checker.py
          fi

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: iphone_duo_state.json
          key: duo-state-${{ github.run_id }}
